name: CI

# Lean on purpose (GitHub Free = 2000 private Actions minutes/month):
#   * pull requests only run the jobs whose paths changed; pushes to main run everything;
#   * a newer push cancels the run it supersedes;
#   * Go modules, npm, Next.js and Docker layers are cached.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Go toolchain for CI and for the backend image (ARG GO_VERSION in backend/Dockerfile): keep both on the same minor
  # version. go.mod states the minimum (1.26.0); CI and the image use the latest patch of the 1.26 line.
  GO_VERSION: "1.26"
  # Pinned so that a new linter release cannot turn CI red by itself; bump it deliberately.
  GOLANGCI_LINT_VERSION: v2.14.0
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Which parts of the repo changed? (always "everything" outside pull requests)
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      mcp: ${{ steps.decide.outputs.mcp }}
      frontend: ${{ steps.decide.outputs.frontend }}
      e2e: ${{ steps.decide.outputs.e2e }}
      lint: ${{ steps.decide.outputs.lint }}
      images: ${{ steps.decide.outputs.images }}
    steps:
      - name: Filter changed paths (pull requests)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
            mcp:
              - 'mcp/**'
            frontend:
              - 'frontend/**'
            stack:
              - 'docker-compose.yml'
              - 'Makefile'
              - '.env.example'
              - '.github/workflows/ci.yml'
              - '.github/ci/**'
            lint:
              - '.github/**'
              - 'deploy/**'
              - 'CHANGELOG.md'

      - name: Decide what to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          F_BACKEND: ${{ steps.filter.outputs.backend }}
          F_MCP: ${{ steps.filter.outputs.mcp }}
          F_FRONTEND: ${{ steps.filter.outputs.frontend }}
          F_STACK: ${{ steps.filter.outputs.stack }}
          F_LINT: ${{ steps.filter.outputs.lint }}
        run: |
          pick() { if [ "$EVENT" != pull_request ] || [ "$1" = true ]; then echo true; else echo false; fi; }
          backend=$(pick "$F_BACKEND")
          mcp=$(pick "$F_MCP")
          frontend=$(pick "$F_FRONTEND")
          stack=$(pick "$F_STACK")
          lint=$(pick "$F_LINT")

          # A shared change (compose file, Makefile, this workflow) rebuilds every image.
          build() { if [ "$1" = true ] || [ "$stack" = true ]; then echo true; else echo false; fi; }
          images=$(jq -nc \
            --arg b "$(build "$backend")" --arg m "$(build "$mcp")" --arg f "$(build "$frontend")" \
            '[ (if $b == "true" then {image: "backend",  context: "backend"}  else empty end),
               (if $m == "true" then {image: "mcp",      context: "mcp"}      else empty end),
               (if $f == "true" then {image: "frontend", context: "frontend"} else empty end) ]')

          e2e=false
          if [ "$backend" = true ] || [ "$mcp" = true ] || [ "$frontend" = true ] || [ "$stack" = true ]; then e2e=true; fi

          {
            echo "backend=$backend"
            echo "mcp=$mcp"
            echo "frontend=$frontend"
            echo "e2e=$e2e"
            echo "lint=$lint"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"
          echo "backend=$backend mcp=$mcp frontend=$frontend e2e=$e2e lint=$lint images=$images"

  # ---------------------------------------------------------------------------
  # Backend: format, vet, lint, unit tests, then integration + e2e on real Postgres/Redis.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # Exactly what backend/LOCAL_DEV.md expects: role socialos/socialos (superuser, so the tests can create their
    # throw-away socialos_it_* databases), database socialos_test, Redis DB 15.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socialos
          POSTGRES_PASSWORD: socialos
          POSTGRES_DB: socialos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U socialos -d socialos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error title=gofmt::these files need gofmt -w:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Runs only when a golangci-lint config exists (backend/.golangci.yml is part of the repo).
      - name: golangci-lint
        if: ${{ hashFiles('backend/.golangci.yml', 'backend/.golangci.yaml', 'backend/.golangci.toml', 'backend/.golangci.json') != '' }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend

      - name: Unit tests
        run: make test

      - name: Integration + e2e tests (Postgres 16, Redis 8)
        env:
          TEST_DATABASE_URL: postgres://socialos:socialos@127.0.0.1:5432/socialos_test?sslmode=disable
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: make test-integration

  # ---------------------------------------------------------------------------
  # MCP server
  # ---------------------------------------------------------------------------
  mcp:
    name: MCP server (Node 22)
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Next.js)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      # Next.js build cache (https://nextjs.org/docs/pages/building-your-application/deploying/ci-build-caching).
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/*.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker: every image must build from its Dockerfile (no push). Layers go to the GitHub Actions cache,
  # which the e2e job below and the release workflow reuse.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          tags: socialos-${{ matrix.image }}:ci
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ---------------------------------------------------------------------------
  # End to end: the real compose stack + the MVP acceptance flow (register -> connect -> MCP agent
  # drafts and schedules -> worker publishes) and a smoke test of the frontend.
  # ---------------------------------------------------------------------------
  e2e-compose:
    name: E2E (docker compose)
    needs: [changes, docker]
    if: ${{ !cancelled() && needs.changes.outputs.e2e == 'true' && needs.docker.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # .github/ci/compose.ci.yml points the services at the images built below instead of building again.
      COMPOSE_FILE: docker-compose.yml:.github/ci/compose.ci.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4

      # Same context, Dockerfile and build args as the docker job, so these are cache hits.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: socialos-backend:ci
          provenance: false
          cache-from: type=gha,scope=backend
      - name: Build mcp image
        uses: docker/build-push-action@v7
        with:
          context: mcp
          load: true
          tags: socialos-mcp:ci
          provenance: false
          cache-from: type=gha,scope=mcp
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          tags: socialos-frontend:ci
          provenance: false
          cache-from: type=gha,scope=frontend

      - name: Create .env (fresh ENCRYPTION_KEY)
        run: make env

      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --no-build --wait --wait-timeout 240

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install MCP dependencies (the acceptance script uses the MCP SDK client)
        working-directory: mcp
        run: npm ci --no-audit --no-fund

      - name: Acceptance flow (API + worker + MCP)
        working-directory: mcp
        env:
          SOCIALOS_API_URL: http://127.0.0.1:8080
          MCP_URL: http://127.0.0.1:3333/mcp
        run: node scripts/acceptance.mjs

      - name: Smoke test
        run: |
          set -eu
          curl -fsS http://127.0.0.1:8080/ready
          echo
          curl -fsS http://127.0.0.1:3333/health
          echo
          # The frontend serves the login page ...
          page="$(curl -fsS --retry 5 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/login)"
          if ! grep -qi 'sign in' <<<"$page"; then
            echo "::error title=frontend smoke test::/login did not contain 'Sign in'"
            exit 1
          fi
          # ... and proxies /api/v1 to the backend (baked-in API_INTERNAL_URL): anonymous /me must be a JSON 401.
          code="$(curl -s -o /tmp/me.json -w '%{http_code}' http://127.0.0.1:3000/api/v1/me)"
          cat /tmp/me.json; echo
          if [ "$code" != 401 ]; then
            echo "::error title=frontend smoke test::GET /api/v1/me through the frontend returned $code, expected 401"
            exit 1
          fi

      - name: Dump compose state and logs
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --timestamps --tail=300 || true

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true

  # ---------------------------------------------------------------------------
  # Workflow files, deploy scripts, production compose file and Caddyfile.
  # ---------------------------------------------------------------------------
  repo-lint:
    name: Lint workflows & deploy files
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: shellcheck
        run: |
          shopt -s nullglob
          scripts=(deploy/*.sh deploy/host-proxy/*.sh deploy/tests/*.sh .github/scripts/*.sh)
          if [ "${#scripts[@]}" -gt 0 ]; then shellcheck "${scripts[@]}"; fi

      - name: Deploy script tests (stubbed docker, curl, caddy, systemctl)
        run: bash deploy/tests/run.sh

      - name: Production compose files resolve with the example environment (standalone and host-proxy)
        run: |
          set -euo pipefail
          standalone=(--env-file deploy/.env.prod.example -f deploy/docker-compose.prod.yml)
          host_proxy=("${standalone[@]}" -f deploy/docker-compose.host-proxy.yml)
          # check MODE JQ_FILTER MESSAGE: the resolved configuration of MODE must satisfy the jq filter.
          check() {
            local -n compose_args=$1
            docker compose "${compose_args[@]}" config --format json | jq -e "$2" >/dev/null ||
              { echo "::error title=compose config ($1)::$3"; exit 1; }
          }
          docker compose "${standalone[@]}" config -q
          docker compose "${host_proxy[@]}" config -q

          check standalone '[.services[] | select(.mem_limit == null)] | length == 0' 'a service has no mem_limit'
          check host_proxy '[.services[] | select(.mem_limit == null)] | length == 0' 'a service has no mem_limit'
          # Standalone is unchanged: caddy owns 80/443 and nothing else publishes a port.
          check standalone '[.services | to_entries[] | select(.value.ports != null) | .key] == ["caddy"]' 'only caddy may publish ports'
          # Host-proxy: no bundled caddy, and everything that is published is bound to 127.0.0.1.
          check host_proxy '.services | has("caddy") | not' 'the bundled caddy is still part of the stack'
          check host_proxy '[.services[].ports[]?.host_ip] | (length > 0) and all(. == "127.0.0.1")' 'a published port is not bound to 127.0.0.1'
          # Host-proxy: under host-wide memory pressure the kernel must pick SocialOS before the host's Caddy or other service,
          # and postgres gets a small /dev/shm (64 MiB, not smaller than its shared_buffers default of 64MB).
          check host_proxy '[.services[] | select(.oom_score_adj != 500)] | length == 0' 'a service lacks oom_score_adj 500'
          check host_proxy '.services.postgres.shm_size | tonumber == 67108864' 'postgres shm_size is not 64mb'
          # ACME_EMAIL is only for the bundled Caddy: host-proxy mode must resolve with it empty (init-env.sh --host-proxy writes
          # it empty). Standalone resolves too, and deploy.sh refuses an empty value there.
          sed 's|^ACME_EMAIL=.*|ACME_EMAIL=|' deploy/.env.prod.example >"$RUNNER_TEMP/env-no-acme"
          docker compose --env-file "$RUNNER_TEMP/env-no-acme" -f deploy/docker-compose.prod.yml -f deploy/docker-compose.host-proxy.yml config -q

      - name: Caddyfile is valid
        run: |
          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=example.com -e ACME_EMAIL=ops@example.com -e S3_SITE=s3.example.com \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # The rendered host snippet is imported by a host Caddyfile that has its own global options, its own snippet called
      # "common" and its own site: none of that may collide. Its routes must also equal those of the standalone Caddyfile
      # (same headers, /metrics block, flush_interval, encode), apart from the upstream addresses.
      - name: Host-proxy Caddy snippet renders, validates and matches the standalone Caddyfile
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/host-proxy"
          mkdir -p "$work/caddy"
          sed 's|^DOMAIN=.*|DOMAIN=example.com|' deploy/.env.prod.example >"$work/env"
          deploy/host-proxy/render-caddy.sh --env "$work/env" --out "$work/caddy/socialos.caddy"
          cat >"$work/Caddyfile" <<'EOF'
          {
          	email ops@example.com
          }
          (common) {
          	header X-Host "1"
          }
          other.example.org {
          	import common
          	respond "ok"
          }
          import /opt/socialos/caddy/*.caddy
          EOF
          host_caddy=(docker run --rm -v "$work/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$work/caddy:/opt/socialos/caddy:ro" caddy:2-alpine caddy)
          "${host_caddy[@]}" validate --config /etc/caddy/Caddyfile --adapter caddyfile

          # Routes without the upstream addresses (the host's own site is left out on the host side).
          "${host_caddy[@]}" adapt --config /etc/caddy/Caddyfile --adapter caddyfile 2>/dev/null |
            jq -S '[.apps.http.servers[].routes[] | select(.match[0].host[0] | startswith("other.") | not)] | map(del(.. | .upstreams?))' >"$work/host.json"
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=example.com -e ACME_EMAIL=ops@example.com -e S3_SITE=s3.example.com \
            caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile 2>/dev/null |
            jq -S '[.apps.http.servers[].routes[]] | map(del(.. | .upstreams?))' >"$work/standalone.json"
          diff -u "$work/standalone.json" "$work/host.json"
