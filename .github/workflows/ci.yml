name: CI

# One workflow, one required check ("CI ok"):
#   * pull requests run only the jobs whose paths changed; pushes to main, the weekly schedule and manual runs run all;
#   * a newer push cancels the pull-request run it supersedes;
#   * the repository is public, so scanners (govulncheck, npm audit, gitleaks, Trivy, CodeQL) live in the jobs below.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 03:00 UTC: new advisories appear without any code change.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Go toolchain for CI and for the backend image (ARG GO_VERSION in backend/Dockerfile): keep both on the same minor
  # version. go.mod states the minimum (1.26.0); CI and the image use the latest patch of the 1.26 line.
  GO_VERSION: "1.26"
  # Pinned so that a new tool release cannot turn CI red by itself; bump deliberately (Dependabot does not track these).
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Which parts of the repo changed? Only used on pull requests; every other event runs every job.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mcp: ${{ steps.filter.outputs.mcp }}
      frontend: ${{ steps.filter.outputs.frontend }}
      site: ${{ steps.filter.outputs.site }}
      e2e: ${{ steps.filter.outputs.e2e }}
      codeql_go: ${{ steps.filter.outputs.codeql_go }}
      codeql_js: ${{ steps.filter.outputs.codeql_js }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # `shared` means "everything": the workflows, the compose file, the Makefile and the env example.
          filters: |
            shared: &shared
              - '.github/**'
              - 'docker-compose.yml'
              - 'Makefile'
              - '.env.example'
            backend:
              - *shared
              - 'backend/**'
            mcp:
              - *shared
              - 'mcp/**'
            frontend:
              - *shared
              - 'frontend/**'
            site:
              - *shared
              - 'site/**'
              - 'frontend/**'
              - 'docs/**'
              - 'README.md'
              - 'mcp/README.md'
            e2e:
              - *shared
              - 'backend/**'
              - 'mcp/**'
              - 'frontend/**'
            codeql_go:
              - *shared
              - 'backend/**'
            codeql_js:
              - *shared
              - 'mcp/**'
              - 'frontend/**'
              - 'site/**'

  # ---------------------------------------------------------------------------
  # Backend: lint (gofmt, vet and more), vulnerabilities, unit tests, then integration + e2e on real Postgres/Redis.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Go)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # Exactly what backend/LOCAL_DEV.md expects: role socialos/socialos (superuser, so the tests can create their
    # throw-away socialos_it_* databases), database socialos_test, Redis DB 15.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socialos
          POSTGRES_PASSWORD: socialos
          POSTGRES_DB: socialos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U socialos -d socialos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.sum

      # golangci-lint v2 runs gofmt (formatters in backend/.golangci.yml) and go vet (govet is a standard linter).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend

      # Fails only for vulnerabilities whose vulnerable symbol is reachable from our code.
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      - name: Unit tests
        run: make test

      - name: Integration + e2e tests (Postgres 16, Redis 8)
        env:
          TEST_DATABASE_URL: postgres://socialos:socialos@127.0.0.1:5432/socialos_test?sslmode=disable
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: make test-integration

  # ---------------------------------------------------------------------------
  # MCP server
  # ---------------------------------------------------------------------------
  mcp:
    name: MCP server (Node 22)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Size ceilings
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # Reads package-lock.json; devDependencies are out of scope on purpose.
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Next.js)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      # Next.js build cache (https://nextjs.org/docs/pages/building-your-application/deploying/ci-build-caching).
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/*.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - name: Build
        run: npm run build
      # Reads package-lock.json; devDependencies are out of scope on purpose.
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # Website and demo: build the in-browser demo of the real app and the site, check links, drive the built site in a real
  # browser (the runner's preinstalled Chrome). On main the result is uploaded for the pages job.
  # ---------------------------------------------------------------------------
  site:
    name: Site and demo
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write # configure-pages reads the Pages settings (what GitHub's own starter workflows grant)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            site/package-lock.json

      # The base path follows the repository (https://<owner>.github.io/<repo>/), so forks and renamed repositories
      # work; a custom domain gives an empty one. Pull requests build with the default project-site path.
      - name: Work out the base path
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="/${REPO}"; origin="https://${OWNER}.github.io"
          else
            base="${PAGES_BASE%/}"; origin="$PAGES_ORIGIN"
          fi
          {
            echo "site=${base}/"
            echo "demo=${base}/demo"
            echo "origin=${origin}"
          } >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build the demo (static export of the real app)
        working-directory: frontend
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.demo }}
        run: npm run build:demo

      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      # Reads package-lock.json; devDependencies are out of scope on purpose.
      - name: npm audit (production dependencies, high and above)
        working-directory: site
        run: npm audit --omit=dev --audit-level=high
      - name: Build the site
        working-directory: site
        env:
          SITE_BASE: ${{ steps.base.outputs.site }}
          SITE_URL: ${{ steps.base.outputs.origin }}
          SITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build
      - name: Check links
        working-directory: site
        env:
          SITE_BASE: ${{ steps.base.outputs.site }}
        run: node scripts/check.mjs dist "$SITE_BASE"
      - name: Smoke test
        working-directory: site
        env:
          SITE_BASE: ${{ steps.base.outputs.site }}
        run: npm run smoke

      - name: Upload the site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  # ---------------------------------------------------------------------------
  # End to end: build the three images once (layers go to the Actions cache that release.yml reuses), run the real
  # compose stack with the MVP acceptance flow (register -> connect -> MCP agent drafts and schedules -> worker
  # publishes) and a smoke test of the frontend, then scan the same images with Trivy.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (docker compose)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Trivy results -> code scanning
    env:
      # .github/ci/compose.ci.yml points the services at the images built below instead of building again.
      COMPOSE_FILE: docker-compose.yml:.github/ci/compose.ci.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: socialos-backend:ci
          provenance: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build mcp image
        uses: docker/build-push-action@v7
        with:
          context: mcp
          load: true
          tags: socialos-mcp:ci
          provenance: false
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          tags: socialos-frontend:ci
          provenance: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Create .env (fresh ENCRYPTION_KEY)
        run: make env

      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --no-build --wait --wait-timeout 240

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install MCP dependencies (the acceptance script uses the MCP SDK client)
        working-directory: mcp
        run: npm ci --no-audit --no-fund

      - name: Acceptance flow (API + worker + MCP)
        working-directory: mcp
        env:
          SOCIALOS_API_URL: http://127.0.0.1:8080
          MCP_URL: http://127.0.0.1:3333/mcp
        run: node scripts/acceptance.mjs

      - name: Smoke test
        run: |
          set -eu
          curl -fsS http://127.0.0.1:8080/ready
          echo
          curl -fsS http://127.0.0.1:3333/health
          echo
          # The frontend serves the login page ...
          page="$(curl -fsS --retry 5 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/login)"
          if ! grep -qi 'sign in' <<<"$page"; then
            echo "::error title=frontend smoke test::/login did not contain 'Sign in'"
            exit 1
          fi
          # ... and proxies /api/v1 to the backend (baked-in API_INTERNAL_URL): anonymous /me must be a JSON 401.
          code="$(curl -s -o /tmp/me.json -w '%{http_code}' http://127.0.0.1:3000/api/v1/me)"
          cat /tmp/me.json; echo
          if [ "$code" != 401 ]; then
            echo "::error title=frontend smoke test::GET /api/v1/me through the frontend returned $code, expected 401"
            exit 1
          fi

      - name: Dump compose state and logs
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --timestamps --tail=300 || true

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true

      - name: Trivy scan (backend)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: socialos-backend:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-backend.sarif
          exit-code: "1"
      # Pull requests from forks get a read-only token and cannot upload.
      - name: Upload Trivy results (backend)
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Trivy scan (mcp)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: socialos-mcp:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-mcp.sarif
          exit-code: "1"
      # Pull requests from forks get a read-only token and cannot upload.
      - name: Upload Trivy results (mcp)
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-mcp.sarif
          category: trivy-mcp

      - name: Trivy scan (frontend)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: socialos-frontend:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-frontend.sarif
          exit-code: "1"
      # Pull requests from forks get a read-only token and cannot upload.
      - name: Upload Trivy results (frontend)
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # ---------------------------------------------------------------------------
  # Always runs (about 45 s): workflow files, deploy scripts, production compose file, Caddyfile, secrets in history.
  # ---------------------------------------------------------------------------
  repo-lint:
    name: Lint workflows & deploy files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the history
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: shellcheck
        run: shellcheck deploy/*.sh deploy/host-proxy/*.sh deploy/tests/*.sh .github/scripts/*.sh

      # The binary is used directly: it needs no licence key, unlike gitleaks-action for organisations.
      # The download is checked against a pinned hash.
      - name: Install gitleaks
        run: |
          set -eu
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$file" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            range="${BASE_SHA}..${HEAD_SHA}"   # only the commits this pull request adds
          else
            range="--all"                      # whole history (push to main, weekly schedule)
          fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --log-opts="$range" .

      - name: Uptime script tests (stubbed gh, local HTTP server)
        run: bash .github/scripts/uptime.test.sh

      - name: Deploy script tests (stubbed docker, curl, caddy, systemctl)
        run: bash deploy/tests/run.sh

      - name: Production compose files resolve with the example environment (standalone and host-proxy)
        run: |
          set -euo pipefail
          standalone=(--env-file deploy/.env.prod.example -f deploy/docker-compose.prod.yml)
          host_proxy=("${standalone[@]}" -f deploy/docker-compose.host-proxy.yml)
          # check MODE JQ_FILTER MESSAGE: the resolved configuration of MODE must satisfy the jq filter.
          check() {
            local -n compose_args=$1
            docker compose "${compose_args[@]}" config --format json | jq -e "$2" >/dev/null ||
              { echo "::error title=compose config ($1)::$3"; exit 1; }
          }
          docker compose "${standalone[@]}" config -q
          docker compose "${host_proxy[@]}" config -q

          check standalone '[.services[] | select(.mem_limit == null)] | length == 0' 'a service has no mem_limit'
          check host_proxy '[.services[] | select(.mem_limit == null)] | length == 0' 'a service has no mem_limit'
          # Standalone is unchanged: caddy owns 80/443 and nothing else publishes a port.
          check standalone '[.services | to_entries[] | select(.value.ports != null) | .key] == ["caddy"]' 'only caddy may publish ports'
          # Host-proxy: no bundled caddy, and everything that is published is bound to 127.0.0.1.
          check host_proxy '.services | has("caddy") | not' 'the bundled caddy is still part of the stack'
          check host_proxy '[.services[].ports[]?.host_ip] | (length > 0) and all(. == "127.0.0.1")' 'a published port is not bound to 127.0.0.1'
          # Host-proxy: under host-wide memory pressure the kernel must pick Steerpost before the host's Caddy or other service,
          # and postgres gets a small /dev/shm (64 MiB, not smaller than its shared_buffers default of 64MB).
          check host_proxy '[.services[] | select(.oom_score_adj != 500)] | length == 0' 'a service lacks oom_score_adj 500'
          check host_proxy '.services.postgres.shm_size | tonumber == 67108864' 'postgres shm_size is not 64mb'
          # Host-proxy: the whole stack runs in socialos.slice (one kernel-enforced budget), no container may swap, and each
          # has a process cap. Standalone needs no slice on the host.
          check host_proxy '[.services[] | select(.cgroup_parent != "socialos.slice")] | length == 0' 'a service is not in socialos.slice'
          check host_proxy '[.services[] | select(.memswap_limit != .mem_limit or .pids_limit == null)] | length == 0' 'a service may swap or has no pids_limit'
          check standalone '[.services[] | select(.cgroup_parent != null)] | length == 0' 'the standalone stack must not depend on socialos.slice'
          # ACME_EMAIL is only for the bundled Caddy: host-proxy mode must resolve with it empty (init-env.sh --host-proxy writes
          # it empty). Standalone resolves too, and deploy.sh refuses an empty value there.
          sed 's|^ACME_EMAIL=.*|ACME_EMAIL=|' deploy/.env.prod.example >"$RUNNER_TEMP/env-no-acme"
          docker compose --env-file "$RUNNER_TEMP/env-no-acme" -f deploy/docker-compose.prod.yml -f deploy/docker-compose.host-proxy.yml config -q

      - name: Caddyfile is valid
        run: |
          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=example.com -e ACME_EMAIL=ops@example.com -e S3_SITE=s3.example.com \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # The rendered host snippet is imported by a host Caddyfile that has its own global options, its own snippet called
      # "common" and its own site: none of that may collide. Its routes must also equal those of the standalone Caddyfile
      # (same headers, /metrics block, flush_interval, encode), apart from the upstream addresses.
      - name: Host-proxy Caddy snippet renders, validates and matches the standalone Caddyfile
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/host-proxy"
          mkdir -p "$work/caddy"
          sed 's|^DOMAIN=.*|DOMAIN=example.com|' deploy/.env.prod.example >"$work/env"
          deploy/host-proxy/render-caddy.sh --env "$work/env" --out "$work/caddy/socialos.caddy"
          cat >"$work/Caddyfile" <<'EOF'
          {
          	email ops@example.com
          }
          (common) {
          	header X-Host "1"
          }
          other.example.org {
          	import common
          	respond "ok"
          }
          import /opt/socialos/caddy/*.caddy
          EOF
          host_caddy=(docker run --rm -v "$work/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$work/caddy:/opt/socialos/caddy:ro" caddy:2-alpine caddy)
          "${host_caddy[@]}" validate --config /etc/caddy/Caddyfile --adapter caddyfile

          # Routes without the upstream addresses (the host's own site is left out on the host side).
          "${host_caddy[@]}" adapt --config /etc/caddy/Caddyfile --adapter caddyfile 2>/dev/null |
            jq -S '[.apps.http.servers[].routes[] | select(.match[0].host[0] | startswith("other.") | not)] | map(del(.. | .upstreams?))' >"$work/host.json"
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=example.com -e ACME_EMAIL=ops@example.com -e S3_SITE=s3.example.com \
            caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile 2>/dev/null |
            jq -S '[.apps.http.servers[].routes[]] | map(del(.. | .upstreams?))' >"$work/standalone.json"
          diff -u "$work/standalone.json" "$work/host.json"

  # ---------------------------------------------------------------------------
  # CodeQL. The categories match the old security.yml so the Security tab keeps one configuration per language.
  # A language whose paths did not change on a pull request skips its steps (a matrix cannot be gated per entry).
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
            run: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.codeql_go == 'true') && 'yes' || 'no' }}
          - language: javascript-typescript
            build-mode: none
            run: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.codeql_js == 'true') && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v7
        if: matrix.run == 'yes'
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: matrix.run == 'yes' && matrix.language == 'go'
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.sum
      - uses: github/codeql-action/init@v4
        if: matrix.run == 'yes'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        if: matrix.run == 'yes'
        with:
          category: /language:${{ matrix.language }}

  # ---------------------------------------------------------------------------
  # The one required check. Skipped jobs (nothing changed there) count as ok; failed or cancelled ones do not.
  # `changes` is listed so that a broken filter cannot turn every skipped job into a green run.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI ok
    if: always()
    needs: [changes, backend, mcp, frontend, site, e2e, repo-lint, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error title=CI::a required job failed or was cancelled"
          exit 1
      - run: echo "All jobs passed or were skipped because nothing relevant changed."

  # ---------------------------------------------------------------------------
  # Publish to GitHub Pages: only after a push to main, with the artifact the site job just built.
  # ---------------------------------------------------------------------------
  pages:
    name: Deploy to GitHub Pages
    needs: site
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Let a running deployment finish; keep only the newest queued one.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
