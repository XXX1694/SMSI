name: Uptime

on:
  schedule:
    # Off-peak minutes: GitHub delays or drops scheduled runs most at :00/:15/:30/:45 when everyone's cron fires.
    # Scheduled runs stay best-effort either way; the external monitor in docs/OWNER-SETUP.md section 6 is the real alarm.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to probe instead of the defaults (empty: UPTIME_URLS or the derived targets)"
        required: false
        default: ""
  # Lets an external monitor or a script trigger an immediate probe:
  # gh api repos/{owner}/{repo}/dispatches -f event_type=uptime-check
  repository_dispatch:
    types: [uptime-check]

permissions:
  issues: write
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    name: Probe public endpoints
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPTIME_URLS: ${{ inputs.urls || vars.UPTIME_URLS }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          MCP_PUBLIC_URL: ${{ vars.MCP_PUBLIC_URL }}
        run: bash .github/scripts/uptime.sh
