name: Uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    name: Probe public endpoints
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPTIME_URLS: ${{ vars.UPTIME_URLS }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          MCP_PUBLIC_URL: ${{ vars.MCP_PUBLIC_URL }}
        run: bash .github/scripts/uptime.sh
