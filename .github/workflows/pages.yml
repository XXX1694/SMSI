name: Pages

# Publishes the website: the landing page and docs (site/) plus the browser-only demo of the real
# app (frontend/, built with `npm run build:demo`) to GitHub Pages.
#
# GitHub Pages is not available for PRIVATE repositories on the Free plan. Until the repository is
# made public (or the account upgrades to Pro/Team/Enterprise and Pages is switched on), the `gate`
# job notices that, prints a clear note and every later job is skipped, so pushes stay green
# instead of failing here each time. Nothing else needs to change once Pages is available.
#
# One-time setup when it is: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions",
# then re-run this workflow (Actions -> Pages -> Run workflow).
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "site/**"
      - "docs/**"
      - "README.md"
      - "mcp/README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Let a running deployment finish; keep only the newest queued one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Is Pages set up for this repository? Costs a few seconds and decides whether to build at all.
  # ---------------------------------------------------------------------------
  gate:
    name: Is Pages enabled?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check the Pages configuration
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          enabled=false
          resp="$(gh api -i "repos/${REPO}/pages" 2>&1 || true)"
          code="$(printf '%s\n' "$resp" | sed -n '1s/^HTTP[^ ]* \([0-9][0-9][0-9]\).*/\1/p')"

          case "$code" in
            200)
              build_type="$(gh api "repos/${REPO}/pages" --jq '.build_type' 2>/dev/null || true)"
              if [ "$build_type" = "workflow" ]; then
                enabled=true
              else
                echo "::notice title=Pages source is not GitHub Actions::Pages is enabled but its source is '${build_type:-unknown}'. Set Settings > Pages > Build and deployment > Source to 'GitHub Actions', then re-run this workflow. Skipping the deployment."
              fi
              ;;
            404)
              echo "::notice title=Pages is not enabled, skipping deployment::GitHub Pages is not enabled for ${REPO}, so the site was not published. Pages for a private repository needs GitHub Pro, Team or Enterprise; on the Free plan make the repository public. Then set Settings > Pages > Source to 'GitHub Actions' and re-run this workflow."
              ;;
            403)
              echo "::notice title=Pages is not available, skipping deployment::GitHub answered 403 for the Pages API of ${REPO}. On the Free plan Pages needs a public repository (or upgrade to Pro/Team/Enterprise). Then set Settings > Pages > Source to 'GitHub Actions' and re-run this workflow."
              ;;
            *)
              echo "::warning title=Could not read the Pages configuration, skipping deployment::The Pages API answered '${code:-no response}'. Re-run this workflow to try again."
              ;;
          esac

          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
          {
            echo "### Pages"
            if [ "$enabled" = true ]; then
              echo "Pages is enabled; building and deploying the site."
            else
              echo "Pages is **not** enabled for this repository, so nothing was published. It needs a public repository (or GitHub Pro/Team/Enterprise for a private one), with the Pages source set to GitHub Actions."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Build the demo and the site, check the result in a real browser, upload it.
  # ---------------------------------------------------------------------------
  build:
    name: Build site and demo
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write # configure-pages reads the Pages settings (the permission GitHub's own starter workflows grant)
    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            site/package-lock.json

      # The site's base path follows the repository (https://<owner>.github.io/<repo>/), so forks
      # and renamed repositories work; a custom domain gives an empty base path.
      - name: Work out the base path
        id: base
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base="${BASE_PATH%/}"
          echo "site=${base}/" >> "$GITHUB_OUTPUT"
          echo "demo=${base}/demo" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the demo (static export of the real app)
        working-directory: frontend
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.demo }}
        run: npm run build:demo

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Test the site scripts
        working-directory: site
        run: npm test

      - name: Build the site
        working-directory: site
        env:
          SITE_BASE: ${{ steps.base.outputs.site }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build

      - name: Check links
        working-directory: site
        env:
          SITE_BASE: ${{ steps.base.outputs.site }}
        run: node scripts/check.mjs dist "$SITE_BASE"

      # A real browser (the runner's preinstalled Chrome) opens the built site exactly as Pages serves it.
      - name: Smoke test
        working-directory: site
        env:
          SITE_BASE: ${{ steps.base.outputs.site }}
        run: npm run smoke

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  # ---------------------------------------------------------------------------
  # Publish.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
