# Host-proxy mode: SocialOS runs behind a reverse proxy that already owns ports 80/443 on the host (for example the
# host's own Caddy or nginx). Use it as an override on top of docker-compose.prod.yml by setting, in .env:
#
#   COMPOSE_FILE=docker-compose.prod.yml:docker-compose.host-proxy.yml
#
# What changes compared to the standalone stack:
#   * the bundled Caddy is not started (its profile is never enabled), so nothing here listens on 80/443;
#   * frontend, backend, mcp and the bundled MinIO are published on 127.0.0.1 only, on ports that rarely collide.
#     The host proxy forwards app./api./mcp./s3.<domain> to them: see host-proxy/render-caddy.sh;
#   * memory limits and Postgres settings are sized for a small shared host (caps: postgres 128m, redis 32m, minio 80m,
#     backend 160m, worker 160m, mcp 64m, frontend 160m, migrate 64m during a deploy);
#   * every SocialOS container has oom_score_adj 500: if the HOST runs out of memory, the kernel picks these containers
#     before the host's Caddy or the other service (their score is around 0);
#   * every SocialOS container runs in the systemd slice socialos.slice, which caps the whole stack (systemd/socialos.slice:
#     1 CPU, 664 MB of RAM, no swap, 512 tasks); each container may not swap (memswap_limit = mem_limit) and runs at most
#     SOCIALOS_PIDS_LIMIT processes. The caps above add up to 784m (848m during a deploy), more than the slice: about 0.3 GB
#     is in use, so the slice only binds when several containers peak at once, and then the OOM kill stays inside it. Install the slice unit before the first `up` with this file, otherwise systemd creates
#     the slice without limits (README, "Sharing a host safely"). SOCIALOS_CGROUP_PARENT= (empty) in .env puts the containers
#     back under Docker's default parent.
#
# Every number below can be overridden in .env (see .env.prod.example). The limits are hard caps: a container above its
# limit is OOM-killed and restarted, which is better than starving the other services on the host.
# The standalone mode (docker-compose.prod.yml alone) is unchanged and remains the default.

# Shared by every SocialOS service in this mode. Docker's systemd cgroup driver accepts only a slice name here.
x-host-guard: &host-guard
  oom_score_adj: 500
  cgroup_parent: ${SOCIALOS_CGROUP_PARENT-socialos.slice}
  pids_limit: ${SOCIALOS_PIDS_LIMIT:-128}

services:
  # Never started: nobody enables this profile. The bundled Caddy would fight the host proxy for ports 80 and 443.
  # (docker-compose.prod.yml still interpolates its variables, which is why ACME_EMAIL stays required in .env.)
  caddy:
    profiles: ["disabled-in-host-proxy-mode"]

  postgres:
    <<: *host-guard
    mem_limit: ${POSTGRES_MEM_LIMIT:-128m}
    memswap_limit: ${POSTGRES_MEM_LIMIT:-128m} # no swap: a leak ends in an OOM kill, not in disk thrash
    # /dev/shm is only used for parallel-query segments (the main shared memory is mmap'd and counted in mem_limit). Keep it
    # at or above shared_buffers so that a different shared_memory_type or a larger buffer pool still fits.
    shm_size: ${POSTGRES_SHM_SIZE:-64mb}
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-64MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-40}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}

  redis:
    <<: *host-guard
    mem_limit: ${REDIS_MEM_LIMIT:-32m}
    memswap_limit: ${REDIS_MEM_LIMIT:-32m}

  minio:
    <<: *host-guard
    mem_limit: ${MINIO_MEM_LIMIT:-80m}
    memswap_limit: ${MINIO_MEM_LIMIT:-80m}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-19000}:9000"
    environment:
      GOMEMLIMIT: ${MINIO_GOMEMLIMIT:-56MiB} # soft limit for the Go GC, under mem_limit

  migrate:
    <<: *host-guard
    mem_limit: ${MIGRATE_MEM_LIMIT:-64m}
    memswap_limit: ${MIGRATE_MEM_LIMIT:-64m}

  backend:
    <<: *host-guard
    mem_limit: ${BACKEND_MEM_LIMIT:-160m}
    memswap_limit: ${BACKEND_MEM_LIMIT:-160m}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18080}:8080"
    environment:
      GOMEMLIMIT: ${BACKEND_GOMEMLIMIT:-100MiB} # leaves about 60 MiB of the cap for non-heap memory (multipart and upload buffers)
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10} # per process (backend and worker); keep 2 x this under POSTGRES_MAX_CONNECTIONS

  worker:
    <<: *host-guard
    stop_grace_period: 45s # WORKER_SHUTDOWN_TIMEOUT (max 35s) + 5s for background jobs must fit in it, so in-flight publishes finish before Docker kills the worker
    mem_limit: ${WORKER_MEM_LIMIT:-160m}
    memswap_limit: ${WORKER_MEM_LIMIT:-160m}
    environment:
      GOMEMLIMIT: ${WORKER_GOMEMLIMIT:-100MiB}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}

  mcp:
    <<: *host-guard
    mem_limit: ${MCP_MEM_LIMIT:-64m}
    memswap_limit: ${MCP_MEM_LIMIT:-64m}
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-13333}:3333"
    environment:
      NODE_OPTIONS: ${MCP_NODE_OPTIONS:---max-old-space-size=40}

  frontend:
    <<: *host-guard
    mem_limit: ${FRONTEND_MEM_LIMIT:-160m}
    memswap_limit: ${FRONTEND_MEM_LIMIT:-160m}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-13000}:3000"
    environment:
      NODE_OPTIONS: ${FRONTEND_NODE_OPTIONS:---max-old-space-size=96}

  # Operator tool (profile "tools", never started by `up`).
  telegram:
    <<: *host-guard
