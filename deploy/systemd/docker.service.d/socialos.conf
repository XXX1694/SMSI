# Drop-in for docker.service, which is installed for SocialOS only on this host. Install: README, "Sharing a host safely".
# Needs `systemctl daemon-reload` only, no Docker restart. Resource settings only: no ordering against the host's other
# services, so this file cannot create a boot ordering cycle with them.
[Service]
# dockerd writes the containers' logs (json-file) and runs docker-proxy for the published ports, outside socialos.slice.
# A quarter of a CPU, and half the weight of the other services when the CPUs are contended.
CPUQuota=25%
CPUWeight=50
# Soft cap (reclaim and throttle, never a kill). dockerd plus docker-proxy use about 150M with page cache (peak 173M):
# check `systemctl show docker -p MemoryPeak` after a deploy.
MemoryHigh=192M
