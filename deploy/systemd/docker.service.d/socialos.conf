# Drop-in for docker.service, which is installed for SocialOS only on this host. Install: README, "Sharing a host safely".
# Needs `systemctl daemon-reload` only: no Docker restart (resource settings apply to the running service, ordering at the
# next boot).
[Unit]
# Boot and shutdown order: the host's own services come up first and go down last. Ordering only: no Wants=/Requires=, so
# neither side can start or stop the other. Name the services of your host here (a unit that does not exist is ignored).
After=caddy.service irbisa.service

[Service]
# dockerd writes the containers' logs (json-file), so a log flood costs dockerd CPU, outside socialos.slice: cap it.
CPUQuota=50%
CPUWeight=50
# Soft cap (reclaim and throttle, never a kill): dockerd uses about 80M.
MemoryHigh=128M
