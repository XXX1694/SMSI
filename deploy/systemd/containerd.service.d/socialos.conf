# Drop-in for containerd.service, which is installed for SocialOS only on this host. Install: README, "Sharing a host
# safely". Needs `systemctl daemon-reload` only: no restart.
[Service]
# containerd unpacks images during a deploy (CPU and page cache) and holds one shim per container (about 12M each).
CPUQuota=50%
CPUWeight=50
# Soft cap only: a hard MemoryMax could OOM-kill the shims, and Docker would lose track of running containers.
MemoryHigh=256M
