# Drop-in for containerd.service, which is installed for SocialOS only on this host. Install: README, "Sharing a host
# safely". Needs `systemctl daemon-reload` only, no restart.
[Service]
# containerd unpacks images during a deploy (CPU and page cache) and holds one shim per container.
CPUQuota=25%
CPUWeight=50
# Soft cap only: a hard MemoryMax could OOM-kill the shims, and Docker would lose track of running containers. About 60M
# of it is process memory; the rest is page cache, which this cap reclaims (check MemoryPeak after a deploy).
MemoryHigh=128M
