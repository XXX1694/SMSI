<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="{{base}}assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{base}}assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{base}}assets/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1317" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Steerpost">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{siteUrl}}{{base}}assets/brand/social-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="{{base}}assets/fonts/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{base}}assets/fonts/onest.css">
  <link rel="stylesheet" href="{{base}}assets/tokens.css">
  <link rel="stylesheet" href="{{base}}assets/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="{{base}}" aria-label="Steerpost home">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path class="mark-path" pathLength="1" d="M7 53.5H19A12 12 0 0 0 31 41.5V33.5A12 12 0 0 1 43 21.5H46" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round"/><path class="mark-tip" d="M42 8.5 59 21.5 42 34.5 46 21.5Z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <span>Steerpost</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="{{base}}docs/"{{navDocs}}>Docs</a>
        <a href="{{repoUrl}}" class="hide-sm" rel="noopener">GitHub</a>
        <a class="btn btn-primary btn-sm" href="{{base}}demo/">Try the demo</a>
      </nav>
    </div>
  </header>
  <main id="main">
{{content}}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Steerpost (formerly SocialOS). The demo runs entirely in your browser; nothing is sent anywhere.</p>
      <nav aria-label="Footer">
        <a href="{{base}}docs/">Docs</a>
        <a href="{{base}}docs/mcp/">MCP</a>
        <a href="{{base}}docs/api/">API</a>
        <a href="{{base}}demo/">Demo</a>
        <a href="{{base}}demo/privacy/">Privacy</a>
        <a href="{{base}}demo/terms/">Terms</a>
        <a href="{{repoUrl}}" rel="noopener">Source</a>
      </nav>
    </div>
  </footer>
  <script type="module" src="{{base}}assets/site.js"></script>
</body>
</html>
