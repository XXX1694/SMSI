<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="{{base}}assets/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SocialOS">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{siteUrl}}{{base}}assets/screens/dashboard-light.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="{{base}}assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{base}}assets/tokens.css">
  <link rel="stylesheet" href="{{base}}assets/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="{{base}}" aria-label="SocialOS home">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><g fill="hsl(var(--background))"><circle cx="11" cy="16" r="3.2"/><circle cx="21" cy="10" r="2.6"/><circle cx="21" cy="22" r="2.6"/></g><path d="M13.6 14.6 18.8 11.4M13.6 17.4l5.2 3.2" stroke="hsl(var(--background))" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        <span>SocialOS</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="{{base}}docs/"{{navDocs}}>Docs</a>
        <a href="{{repoUrl}}" class="hide-sm" rel="noopener">GitHub</a>
        <a class="btn btn-primary btn-sm" href="{{base}}demo/">Try the demo</a>
      </nav>
    </div>
  </header>
  <main id="main">
{{content}}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>SocialOS. The demo runs entirely in your browser; nothing is sent anywhere.</p>
      <nav aria-label="Footer">
        <a href="{{base}}docs/">Docs</a>
        <a href="{{base}}docs/mcp/">MCP</a>
        <a href="{{base}}docs/api/">API</a>
        <a href="{{base}}demo/">Demo</a>
        <a href="{{repoUrl}}" rel="noopener">Source</a>
      </nav>
    </div>
  </footer>
  <script type="module" src="{{base}}assets/site.js"></script>
</body>
</html>
