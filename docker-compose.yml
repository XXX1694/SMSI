# SocialOS local development stack: `docker compose up` (or `make up`).
# Configuration comes from .env (copy .env.example; `make env` does it and generates ENCRYPTION_KEY).
# Every long-running service has a healthcheck, so `docker compose up -d --wait` blocks until the stack is
# usable: postgres, redis, minio and worker are defined below; backend, mcp and frontend use the HEALTHCHECK
# baked into their images (backend/Dockerfile, mcp/Dockerfile, frontend/Dockerfile).
# The production stack (published GHCR images, Caddy, HTTPS) is deploy/docker-compose.prod.yml.
name: socialos

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_FORMAT: json
  DATABASE_URL: postgres://${POSTGRES_USER:-socialos}:${POSTGRES_PASSWORD:-socialos}@postgres:5432/${POSTGRES_DB:-socialos}?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (make env generates one)}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
  WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:3333/mcp}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-socialos}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-socialos-dev-secret}
  S3_BUCKET: ${S3_BUCKET:-socialos-media}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_USE_SSL: "false"
  S3_AUTO_CREATE_BUCKET: "true"
  SOCIAL_MOCK_PROVIDERS: ${SOCIAL_MOCK_PROVIDERS:-true}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_UPDATES_MODE: ${TELEGRAM_UPDATES_MODE:-polling}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialos}
      POSTGRES_DB: ${POSTGRES_DB:-socialos}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Pinned so a new upstream release cannot break CI or your local stack (the healthcheck needs the bundled `mc`).
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-socialos}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-socialos-dev-secret}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["/app/migrate", "up"]
    environment: *backend-env
    healthcheck:
      disable: true # one-shot: the image's HEALTHCHECK probes the API port, which a migration run never opens
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  backend:
    build: ./backend
    command: ["/app/api"]
    environment: *backend-env
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["/app/worker"]
    environment: *backend-env
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  mcp:
    build: ./mcp
    environment:
      SOCIALOS_API_URL: http://backend:8080
      PORT: "3333"
    ports: ["127.0.0.1:3333:3333"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8080
        NEXT_PUBLIC_MCP_URL: ${MCP_PUBLIC_URL:-http://localhost:3333/mcp}
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8080}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
